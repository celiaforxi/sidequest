services:
  - type: web
    name: sidequest-paris
    runtime: node
    plan: free
    buildCommand: node --test tests/*.test.mjs
    startCommand: node server.mjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: HOST
        value: 0.0.0.0
      - key: AI_PROVIDER
        value: deepseek
      - key: DEEPSEEK_MODEL
        value: deepseek-flash
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: AI_DAILY_LIMIT
        value: 100
